name: tests

# Runs the unit tests on every push and pull request. The tests use the bot's
# mock mode and fake clients, so no Discord, Splunk or SSH access is needed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pip install ruff==0.17.3
      - run: ruff check .
      - run: python -m pytest -q
