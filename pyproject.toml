[project]
name = "soc-bot"
version = "0.1.0"
description = "ChatOps bot for Splunk alert triage and SSH containment in a local SOC lab"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported and then named as test arguments, which ruff reads as a redefinition
"tests/*" = ["F811"]
