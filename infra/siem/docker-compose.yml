# SIEM stack for the lab (soc-siem VM, 192.168.56.10): Splunk + Logstash.
# Copy .env.example to .env, fill in the values (chmod 600 .env), then: docker compose up -d
# Setting SPLUNK_START_ARGS and SPLUNK_GENERAL_TERMS means you accept Splunk's licence terms. Read them first.
services:
  splunk:
    image: splunk/splunk:latest
    container_name: splunk
    hostname: splunk
    restart: unless-stopped
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}
    ports:
      - "8000:8000"   # web interface
      - "8088:8088"   # HTTP event collector (HEC), HTTPS with a self-signed certificate
      - "8089:8089"   # management / REST API
    volumes:
      - splunk-var:/opt/splunk/var
      - splunk-etc:/opt/splunk/etc

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    container_name: logstash
    restart: unless-stopped
    depends_on:
      splunk:
        condition: service_healthy   # wait until Splunk is ready to receive events
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
      XPACK_MONITORING_ENABLED: "false"   # stops Logstash looking for an Elasticsearch that does not exist
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}
    ports:
      - "5044:5044"   # Beats input (Filebeat connects here)
    volumes:
      # Logstash loads EVERY file in this folder. Never keep backups (.bak) in it.
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro

volumes:
  splunk-var:
  splunk-etc:
