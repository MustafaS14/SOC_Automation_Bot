# Re-send alerts that could not be delivered while the bot was down (see README.md, "Retries and the queue").
# The script does nothing when local/spool is empty and prints nothing on stdout, so no events are indexed.
# The full path is used so the stanza does not depend on how Splunk resolves ./bin/ (btool prints the path without the
# slash before the file name either way; that is only how it displays it).
[script://$SPLUNK_HOME/etc/apps/soc_bot_alert/bin/soc_bot_resend.py]
disabled = 0
interval = 120
python.version = python3
