[Risky sudo use: root shell, wrong password or not allowed]
action.soc_bot_webhook = 1
action.ssg_mobile_alert.passSystemAuth = 1
action.webhook.enable_allowlist = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 30m
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=linux sourcetype=linux:auth "sudo:"\
| rex "sudo:\s+(?<who>\S+)\s+:\s+(?<what>.*)$"\
| where isnotnull(who)\
| eval cmd=mvindex(split(what,"COMMAND="),1)\
| eval kind=case(match(what,"NOT in sudoers"),"the user is not allowed to use sudo", match(what,"incorrect password attempt"),"wrong sudo password", match(cmd,"^(/usr)?/bin/((ba|da|z)?sh|su)(\s|$)"),"a root shell was opened")\
| where isnotnull(kind)\
| eval severity="Medium"\
| eval techniques="T1548.003"\
| eval description="T1548.003 Sudo abuse: ".kind." (user ".who."). ".substr(what,1,200)\
| table _time host severity techniques description who kind

[SSH brute force: many failed logins from one address]
action.soc_bot_webhook = 1
action.ssg_mobile_alert.passSystemAuth = 1
action.webhook.enable_allowlist = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 30m
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=linux sourcetype=linux:auth sshd "Failed password for"\
| rex "Failed password for (?:invalid user )?(?<user>\S+) from (?<src_ip>\d+\.\d+\.\d+\.\d+)"\
| where isnotnull(src_ip)\
| bin _time span=10m\
| stats count AS tries dc(user) AS users values(user) AS names BY host src_ip _time\
| where tries>=5\
| eval severity="High"\
| eval techniques="T1110"\
| eval description="T1110 Brute force: ".tries." failed SSH logins from ".src_ip." in ten minutes, trying ".users." different user names (".mvjoin(mvindex(names,0,4),", ").")."

