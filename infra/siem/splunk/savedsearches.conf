dispatch.earliest_time = -15m
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=linux sourcetype=linux:audit type=EXECVE\
| eval a2d=if(a0="sh" AND a1="-c" AND match(a2,"^([0-9A-Fa-f]{2})+$"), urldecode(replace(a2,"([0-9A-Fa-f]{2})","%\1")), a2)\
| eval cmd=if(a0="sh" AND a1="-c", a2d, trim(a0." ".coalesce(a1,"")." ".coalesce(a2,"")." ".coalesce(a3,"")))\
| where match(cmd,"(unset\s+HISTFILE|HISTFILE=/dev/null|history\s+-c|>\s*\S*\.(bash|zsh)_history|^(rm|shred|truncate|unlink)\s.*_history)")\
| eval severity="Medium"\
| eval techniques="T1070.003"\
| eval description="T1070.003 Clear Command History: a command removed or switched off the shell history. Command: ".substr(cmd,1,300)\
| table _time host severity techniques description

