# Splunk saved searches (alerts) for the SOC lab.
# Copy of /opt/splunk/etc/apps/search/local/savedsearches.conf on soc-siem.
# To restore: copy this file to that path inside the splunk container (as the
# splunk user) and restart Splunk. Notes: ../../../docs/detections.md
# No secrets belong in this file.

[Masquerading process: ./splunkd from home directory]
action.ssg_mobile_alert.passSystemAuth = 1
action.webhook.enable_allowlist = 0
alert.digest_mode = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 30m
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=linux sourcetype=linux:audit type=EXECVE a0="./splunkd"\
| rex field=a2 "https?://(?<src_ip>\d+\.\d+\.\d+\.\d+)"\
| eval severity="High"\
| table _time host src_ip severity a0 a1 a2

[Discovery burst: several reconnaissance commands in ten minutes]
action.ssg_mobile_alert.passSystemAuth = 1
action.webhook.enable_allowlist = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 30m
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=linux sourcetype=linux:audit type=EXECVE\
| eval a2d=if(a0="sh" AND a1="-c" AND match(a2,"^([0-9A-Fa-f]{2})+$"), urldecode(replace(a2,"([0-9A-Fa-f]{2})","%\1")), a2)\
| eval cmd=if(a0="sh" AND a1="-c", a2d, a0)\
| eval technique=case(match(cmd,"^(whoami|id)(\s|$)"),"T1033 who am I", match(cmd,"(/etc/passwd|^getent\s+passwd)"),"T1087.001 account list", match(cmd,"^ps(\s|$)"),"T1057 process list", match(cmd,"^(uname|hostname)(\s|$)"),"T1082 system info", match(cmd,"^(ifconfig|netstat|ss|ip)(\s|$)"),"T1016 network config")\
| where isnotnull(technique)\
| bin _time span=10m\
| stats dc(technique) AS techniques values(technique) AS what values(cmd) AS commands BY host _time\
| where techniques>=3\
| eval severity="Medium"
