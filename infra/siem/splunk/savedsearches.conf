# Splunk saved searches (alerts) for the SOC lab.
# Copy of /opt/splunk/etc/apps/search/local/savedsearches.conf on soc-siem.
# To restore: copy this file to that path inside the splunk container (as the
# splunk user) and restart Splunk. Notes: ../../../docs/detections.md
# No secrets belong in this file.

[Masquerading process: ./splunkd from home directory]
action.ssg_mobile_alert.passSystemAuth = 1
action.webhook.enable_allowlist = 0
alert.digest_mode = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 30m
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=linux sourcetype=linux:audit type=EXECVE a0="./splunkd"\
| rex field=a2 "https?://(?<src_ip>\d+\.\d+\.\d+\.\d+)"\
| eval severity="High"\
| table _time host src_ip severity a0 a1 a2
