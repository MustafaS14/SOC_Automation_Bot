# Logstash pipeline for the SOC lab: Filebeat (victim) -> filter -> Splunk HEC.
# Lives in ~/siem/logstash/pipeline/ on soc-siem. Keep ONLY this file in that folder.

input {
  beats {
    port => 5044          # plain TCP, no TLS: acceptable on the isolated host-only lab network
  }
}

filter {
  # 1. Noise: the hourly sysstat job is not interesting.
  if [message] =~ /debian-sa1/ { drop {} }

  # 2. Label each log type so Splunk knows what it is looking at.
  if [log][file][path] =~ /audit\.log/ {
    mutate { add_field => { "[@metadata][sourcetype]" => "linux:audit" } }

    # Keep the useful audit records, drop the bulky ones that repeat the same story.
    if [message] =~ /^type=(PATH|CWD|BPRM_FCAPS|PROCTITLE) / { drop {} }

    # The real event time is inside the line: msg=audit(<epoch seconds>:<serial>)
    grok {
      match => { "message" => "msg=audit\(%{NUMBER:[@metadata][hec_time]}:" }
      tag_on_failure => ["audit_time_parse_failed"]
    }
  } else if [log][file][path] =~ /auth\.log/ {
    mutate { add_field => { "[@metadata][sourcetype]" => "linux:auth" } }

    # auth.log lines start with an ISO timestamp, e.g. 2026-10-29T15:39:37.123+01:00
    grok {
      match => { "message" => "^%{TIMESTAMP_ISO8601:[@metadata][auth_ts]} " }
      tag_on_failure => ["auth_time_parse_failed"]
    }
    if [@metadata][auth_ts] {
      date { match => ["[@metadata][auth_ts]", "ISO8601"] }
    }
  } else {
    mutate { add_field => { "[@metadata][sourcetype]" => "linux:other" } }
  }

  # 3. Splunk wants the event time as epoch seconds. Use the audit time if we found it, else the log time.
  if ![@metadata][hec_time] {
    ruby { code => 'event.set("[@metadata][hec_time]", event.get("@timestamp").to_f.to_s)' }
  }
}

output {
  http {
    url => "https://splunk:8088/services/collector/event"
    http_method => "post"
    format => "json"
    headers => { "Authorization" => "Splunk ${SPLUNK_HEC_TOKEN}" }
    # Splunk's HEC uses a self-signed certificate. Skipping verification is acceptable ONLY in this closed lab.
    ssl_verification_mode => "none"
    mapping => {
      "time"       => "%{[@metadata][hec_time]}"
      "event"      => "%{message}"
      "host"       => "%{[host][name]}"
      "sourcetype" => "%{[@metadata][sourcetype]}"
      "index"      => "linux"
    }
  }
}
